name: alldocs

services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the bucket and apply a 24h auto-purge lifecycle rule.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/alldocs;
      mc ilm rule add --expire-days 1 local/alldocs || true;
      mc anonymous set download local/alldocs/outputs || true;
      echo 'bucket ready with 1-day lifecycle purge';
      "

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PORT: 4000
      JWT_SECRET: dev-insecure-secret-change-me
      CORS_ORIGIN: http://localhost:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: alldocs
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '4000:4000'

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: alldocs
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      DOWNLOAD_URL_TTL: '3600'
    deploy:
      replicas: 1

volumes:
  minio-data:
